{% load static %}
<!DOCTYPE html>
<html lang="vi">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>DATN ERP - API Documentation</title>
    <!-- Load Swagger UI CSS -->
    <link rel="stylesheet" href="https://unpkg.com/swagger-ui-dist@5/swagger-ui.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
      html {
        box-sizing: border-box;
        overflow-y: scroll;
      }
      *,
      *:before,
      *:after {
        box-sizing: inherit;
      }
      body {
        margin: 0;
        background: #fafafa;
        font-family: 'Outfit', sans-serif;
      }
      /* Custom Swagger Header Topbar styling */
      .swagger-ui .topbar {
        background-color: #0f172a !important; /* slate-900 */
        padding: 12px 0;
        border-bottom: 3px solid #3b82f6; /* blue-500 */
        box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1);
      }
      .swagger-ui .topbar a {
        text-decoration: none;
        font-weight: 700;
        color: #ffffff !important;
        font-size: 1.3em;
        display: flex;
        align-items: center;
        letter-spacing: 0.5px;
      }
      .swagger-ui .topbar a span {
        display: inline-block;
      }
      .swagger-ui .topbar a span::after {
        content: " ERP API Documentation";
        color: #3b82f6; /* blue-500 */
        font-weight: 500;
        margin-left: 8px;
      }
      .swagger-ui .topbar .download-url-wrapper {
        display: flex;
        align-items: center;
      }
      .swagger-ui .topbar .download-url-wrapper .select-label {
        color: #94a3b8 !important; /* slate-400 */
        font-weight: 500;
        margin-right: 10px;
      }
      /* Style dropdown chọn tài liệu */
      .swagger-ui .topbar .download-url-wrapper select {
        border: 1px solid #334155 !important; /* slate-700 */
        background: #1e293b !important; /* slate-800 */
        color: #f8fafc !important; /* slate-50 */
        border-radius: 6px !important;
        padding: 6px 12px !important;
        font-family: 'Outfit', sans-serif;
        font-weight: 500;
        outline: none;
        cursor: pointer;
        transition: all 0.2s ease;
      }
      .swagger-ui .topbar .download-url-wrapper select:hover {
        border-color: #3b82f6 !important;
      }
      /* Custom sections layout */
      .swagger-ui .info {
        margin: 30px 0 !important;
      }
      .swagger-ui .info .title {
        font-family: 'Outfit', sans-serif;
        color: #1e293b;
        font-weight: 700;
      }
    </style>
  </head>
  <body>
    <div id="swagger-ui"></div>
    <!-- Load Swagger UI Bundle and Standalone Preset JS -->
    <script src="https://unpkg.com/swagger-ui-dist@5/swagger-ui-bundle.js" crossorigin></script>
    <script src="https://unpkg.com/swagger-ui-dist@5/swagger-ui-standalone-preset.js" crossorigin></script>
    <script>
      window.onload = () => {
        window.ui = SwaggerUIBundle({
          urls: [
            { url: "{% static 'api_docs/accounts.yaml' %}", name: "1. Accounts & Authentication" },
            { url: "{% static 'api_docs/master_data.yaml' %}", name: "2. Master Data" },
            { url: "{% static 'api_docs/inventory.yaml' %}", name: "3. Inventory Management" },
            { url: "{% static 'api_docs/manufacturing.yaml' %}", name: "4. Manufacturing" },
            { url: "{% static 'api_docs/purchasing.yaml' %}", name: "5. Purchasing" },
            { url: "{% static 'api_docs/procurement.yaml' %}", name: "6. Procurement" },
            { url: "{% static 'api_docs/sales.yaml' %}", name: "7. Sales & Orders" },
            { url: "{% static 'api_docs/finance.yaml' %}", name: "8. Finance & Accounting" },
            { url: "{% static 'api_docs/crm.yaml' %}", name: "9. CRM" }
          ],
          dom_id: '#swagger-ui',
          deepLinking: true,
          presets: [
            SwaggerUIBundle.presets.apis,
            SwaggerUIStandalonePreset
          ],
          plugins: [
            SwaggerUIBundle.plugins.DownloadUrl
          ],
          layout: "StandaloneLayout"
        });
      };
    </script>
  </body>
</html>
