openapi: 3.0.0
info:
  title: DATN ERP System API - Manufacturing
  version: 1.0.0
  description: API Documentation for the DATN ERP System Backend - Manufacturing Module.
servers:
  - url: /api/v1
    description: Local development server
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  responses:
    UnauthorizedError:
      description: Unauthorized. Missing or invalid authentication token.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    ForbiddenError:
      description: Forbidden. User lacks necessary permissions.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    NotFoundError:
      description: Not Found. Resource does not exist.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    BadRequestError:
      description: Bad Request. Lỗi xác thực dữ liệu.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
  schemas:
    ErrorResponse:
      type: object
      properties:
        detail:
          type: string
    BOMItem:
      type: object
      properties:
        id:
          type: string
          format: uuid
        item:
          type: string
          format: uuid
        item_code:
          type: string
        item_name:
          type: string
        quantity:
          type: number
    BOM:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        item:
          type: string
          format: uuid
        item_code:
          type: string
        item_name:
          type: string
        quantity:
          type: number
        description:
          type: string
          nullable: true
        is_active:
          type: boolean
        mold:
          type: string
          format: uuid
          nullable: true
        mold_code:
          type: string
          nullable: true
        mold_name:
          type: string
          nullable: true
        items_count:
          type: integer
        items:
          type: array
          items:
            $ref: '#/components/schemas/BOMItem'
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    BOMInput:
      type: object
      required:
        - name
        - item_id
        - items
      properties:
        name:
          type: string
        item_id:
          type: string
          format: uuid
        quantity:
          type: number
        description:
          type: string
          nullable: true
        mold_id:
          type: string
          format: uuid
          nullable: true
        items:
          type: array
          items:
            type: object
            required:
              - item_id
              - quantity
            properties:
              item_id:
                type: string
                format: uuid
              quantity:
                type: number
    BOMUpdateInput:
      type: object
      properties:
        name:
          type: string
        quantity:
          type: number
        description:
          type: string
          nullable: true
        mold_id:
          type: string
          format: uuid
          nullable: true
        items:
          type: array
          items:
            type: object
            required:
              - item_id
              - quantity
            properties:
              item_id:
                type: string
                format: uuid
              quantity:
                type: number
    BOMListResponse:
      type: object
      properties:
        count:
          type: integer
        next:
          type: string
          nullable: true
        previous:
          type: string
          nullable: true
        results:
          type: array
          items:
            $ref: '#/components/schemas/BOM'
    WorkOrder:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        bom_id:
          type: string
          format: uuid
          nullable: true
        production_item_id:
          type: string
          format: uuid
        quantity:
          type: number
        produced_qty:
          type: number
        source_warehouse:
          type: string
        target_warehouse:
          type: string
        production_warehouse:
          type: string
        status:
          type: string
          enum: [pending_approval, in_progress, pending_production_complete, completed, cancelled]
        planned_start_date:
          type: string
          format: date
        planned_end_date:
          type: string
          format: date
          nullable: true
        actual_end_date:
          type: string
          format: date
          nullable: true
        remarks:
          type: string
          nullable: true
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    WorkOrderInput:
      type: object
      required:
        - name
        - bom_id
        - quantity
        - source_warehouse_id
        - target_warehouse_id
        - production_warehouse_id
        - planned_start_date
      properties:
        name:
          type: string
        bom_id:
          type: string
          format: uuid
        quantity:
          type: number
        source_warehouse_id:
          type: string
          format: uuid
        target_warehouse_id:
          type: string
          format: uuid
        production_warehouse_id:
          type: string
          format: uuid
        planned_start_date:
          type: string
          format: date
        planned_end_date:
          type: string
          format: date
          nullable: true
        remarks:
          type: string
          nullable: true
    WorkOrderDeclareInput:
      type: object
      required:
        - produced_qty
      properties:
        produced_qty:
          type: number
    MaterialPreviewInput:
      type: object
      required:
        - bom_id
        - quantity
        - source_warehouse_id
      properties:
        bom_id:
          type: string
          format: uuid
        quantity:
          type: number
        source_warehouse_id:
          type: string
          format: uuid
    MaterialPreviewItem:
      type: object
      properties:
        item_id:
          type: string
          format: uuid
        item_code:
          type: string
        item_name:
          type: string
        required_qty:
          type: number
        available_qty:
          type: number
        missing_qty:
          type: number
    WorkOrderListResponse:
      type: object
      properties:
        count:
          type: integer
        next:
          type: string
          nullable: true
        previous:
          type: string
          nullable: true
        results:
          type: array
          items:
            $ref: '#/components/schemas/WorkOrder'
security:
  - bearerAuth: []
paths:
  /manufacturing/bom/create/:
    post:
      summary: Tạo định mức (BOM)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BOMInput'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BOM'
        '400':
          $ref: '#/components/responses/BadRequestError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'

  /manufacturing/bom/{bom_id}/update/:
    put:
      summary: Cập nhật định mức (BOM)
      parameters:
        - in: path
          name: bom_id
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BOMUpdateInput'
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BOM'
        '400':
          $ref: '#/components/responses/BadRequestError'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'

  /manufacturing/bom/{bom_id}/delete/:
    delete:
      summary: Xóa định mức (BOM)
      parameters:
        - in: path
          name: bom_id
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: Deleted
        '400':
          $ref: '#/components/responses/BadRequestError'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'

  /manufacturing/bom/list/:
    get:
      summary: Lấy danh sách định mức (BOM)
      parameters:
        - in: query
          name: search
          schema:
            type: string
        - in: query
          name: is_active
          schema:
            type: boolean
        - in: query
          name: limit
          schema:
            type: integer
            default: 20
        - in: query
          name: offset
          schema:
            type: integer
            default: 0
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BOMListResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'

  /manufacturing/bom/{bom_id}/:
    get:
      summary: Lấy chi tiết định mức (BOM)
      parameters:
        - in: path
          name: bom_id
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BOM'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'

  /manufacturing/material-preview/:
    post:
      summary: Xem trước nguyên liệu cần thiết
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MaterialPreviewInput'
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/MaterialPreviewItem'
        '400':
          $ref: '#/components/responses/BadRequestError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'

  /manufacturing/work-order/create/:
    post:
      summary: Tạo lệnh sản xuất mới
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WorkOrderInput'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkOrder'
        '400':
          $ref: '#/components/responses/BadRequestError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'

  /manufacturing/work-order/{work_order_id}/approve/:
    post:
      summary: Phê duyệt lệnh sản xuất
      parameters:
        - in: path
          name: work_order_id
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Approved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkOrder'
        '400':
          $ref: '#/components/responses/BadRequestError'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'

  /manufacturing/work-order/{work_order_id}/declare/:
    post:
      summary: Nhập liệu sản xuất
      parameters:
        - in: path
          name: work_order_id
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WorkOrderDeclareInput'
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkOrder'
        '400':
          $ref: '#/components/responses/BadRequestError'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'

  /manufacturing/work-order/{work_order_id}/complete/:
    post:
      summary: Hoàn thành lệnh sản xuất
      parameters:
        - in: path
          name: work_order_id
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Completed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkOrder'
        '400':
          $ref: '#/components/responses/BadRequestError'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'

  /manufacturing/work-order/{work_order_id}/cancel/:
    post:
      summary: Hủy lệnh sản xuất
      parameters:
        - in: path
          name: work_order_id
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Cancelled
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkOrder'
        '400':
          $ref: '#/components/responses/BadRequestError'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'

  /manufacturing/work-order/list/:
    get:
      summary: Lấy danh sách lệnh sản xuất
      parameters:
        - in: query
          name: search
          schema:
            type: string
        - in: query
          name: status
          schema:
            type: string
            enum: [pending_approval, in_progress, pending_production_complete, completed, cancelled]
        - in: query
          name: limit
          schema:
            type: integer
            default: 20
        - in: query
          name: offset
          schema:
            type: integer
            default: 0
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkOrderListResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'

  /manufacturing/work-order/{work_order_id}/:
    get:
      summary: Lấy chi tiết lệnh sản xuất
      parameters:
        - in: path
          name: work_order_id
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkOrder'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
