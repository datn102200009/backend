openapi: 3.0.0
info:
  title: Finance API
  version: 1.0.0
  description: API documentation for the Finance module (Cash Flows).

servers:
  - url: /api/v1
    description: V1 API

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    CashFlowInput:
      type: object
      required:
        - payment_type
        - amount
        - payment_date
      properties:
        payment_type:
          type: string
          enum: [receive, pay]
        amount:
          type: string
          pattern: '^\d+(\.\d{1,2})?$'
        payment_date:
          type: string
          format: date
        category:
          type: string
          maxLength: 100
        payment_method:
          type: string
          enum: [cash, bank_transfer, credit_card, other]
          default: bank_transfer
        purchase_order_id:
          type: string
          format: uuid
          nullable: true
        sales_order_id:
          type: string
          format: uuid
          nullable: true
        purchase_invoice_id:
          type: string
          format: uuid
          nullable: true
        sales_invoice_id:
          type: string
          format: uuid
          nullable: true
        remarks:
          type: string

    CashFlowTransaction:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        payment_type:
          type: string
          enum: [receive, pay]
        category:
          type: string
        amount:
          type: string
        payment_date:
          type: string
          format: date
        remarks:
          type: string
        purchase_order:
          type: string
          format: uuid
          nullable: true
        sales_order:
          type: string
          format: uuid
          nullable: true
        purchase_invoice:
          type: string
          format: uuid
          nullable: true
        sales_invoice:
          type: string
          format: uuid
          nullable: true
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    FixedAsset:
      type: object
      properties:
        id:
          type: string
          format: uuid
        asset_code:
          type: string
        asset_name:
          type: string
        original_value:
          type: string
        salvage_value:
          type: string
        depreciation_method:
          type: string
          enum: [straight_line, unit_of_production]
        useful_life_months:
          type: integer
        remaining_life_months:
          type: integer
        designed_capacity:
          type: number
          format: double
          nullable: true
        accumulated_depreciation:
          type: string
        remaining_value:
          type: string
        department:
          type: string
          nullable: true
        is_active:
          type: boolean
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    FixedAssetInput:
      type: object
      required:
        - asset_code
        - asset_name
        - original_value
        - depreciation_method
        - useful_life_months
      properties:
        asset_code:
          type: string
          maxLength: 100
        asset_name:
          type: string
          maxLength: 255
        original_value:
          type: string
        salvage_value:
          type: string
          default: '0.00'
        depreciation_method:
          type: string
          enum: [straight_line, unit_of_production]
        useful_life_months:
          type: integer
          minimum: 1
        designed_capacity:
          type: number
          format: double
          minimum: 0.01
          nullable: true
        department:
          type: string
          maxLength: 100
          nullable: true

    FixedAssetUpdateInput:
      type: object
      properties:
        asset_name:
          type: string
          maxLength: 255
        original_value:
          type: string
        salvage_value:
          type: string
        depreciation_method:
          type: string
          enum: [straight_line, unit_of_production]
        useful_life_months:
          type: integer
          minimum: 1
        designed_capacity:
          type: number
          format: double
          minimum: 0.01
          nullable: true
        department:
          type: string
          maxLength: 100
          nullable: true

    FixedAssetDepreciationLog:
      type: object
      properties:
        id:
          type: string
          format: uuid
        asset:
          type: string
          format: uuid
        asset_code:
          type: string
        asset_name:
          type: string
        period:
          type: string
        depreciation_amount:
          type: string
        remarks:
          type: string
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    RunDepreciationInput:
      type: object
      required:
        - period
      properties:
        period:
          type: string
          pattern: '^\d{4}-\d{2}$'

    PayInvoiceInput:
      type: object
      required:
        - amount
      properties:
        amount:
          type: number
          format: double
          minimum: 0.01
        payment_method:
          type: string
          enum: [cash, bank_transfer]
          default: bank_transfer

    PurchaseInvoice:
      type: object
      properties:
        id:
          type: string
          format: uuid
        order:
          type: string
          format: uuid
        vendor:
          type: string
          format: uuid
        vendor_name:
          type: string
        status:
          type: string
          enum: [unpaid, partial, paid, blocked_for_payment, cancelled]
        total_amount:
          type: number
          format: double
        paid_amount:
          type: number
          format: double
        due_date:
          type: string
          format: date
          nullable: true

  responses:
    UnauthorizedError:
      description: Missing or invalid authentication token.
    ForbiddenError:
      description: The user does not have permission to perform this action.
    ValidationError:
      description: Invalid input data (e.g. overpayment, negative numbers).
      content:
        application/json:
          schema:
            type: object
            properties:
              detail:
                type: string
    NotFoundError:
      description: Requested reference order or invoice could not be found.
      content:
        application/json:
          schema:
            type: object
            properties:
              detail:
                type: string

security:
  - bearerAuth: []

paths:
  /finance/cash-flows/:
    get:
      summary: List Cash Flows
      description: Returns a list of cash flow transactions.
      tags:
        - Cash Flows
      responses:
        '200':
          description: A list of cash flows.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CashFlowTransaction'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'

    post:
      summary: Create Cash Flow Transaction
      description: Creates a new cash flow transaction. Can optionally link to orders or invoices to process deposits or payments. Validates overpayment logic.
      tags:
        - Cash Flows
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CashFlowInput'
      responses:
        '201':
          description: Cash flow successfully created and cross-updated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CashFlowTransaction'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          $ref: '#/components/responses/NotFoundError'

  /finance/cash-flows/{pk}/:
    get:
      summary: Get Cash Flow Transaction
      description: Retrieves a specific cash flow transaction by ID.
      tags:
        - Cash Flows
      parameters:
        - name: pk
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Cash flow details.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CashFlowTransaction'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          $ref: '#/components/responses/NotFoundError'

  /finance/fixed-assets/:
    get:
      summary: List Fixed Assets
      description: Returns a paginated list of fixed assets.
      tags:
        - Fixed Assets
      parameters:
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            default: 50
        - name: page
          in: query
          required: false
          schema:
            type: integer
            default: 1
      responses:
        '200':
          description: A paginated list of fixed assets.
          content:
            application/json:
              schema:
                type: object
                properties:
                  count:
                    type: integer
                  total_pages:
                    type: integer
                  current_page:
                    type: integer
                  results:
                    type: array
                    items:
                      $ref: '#/components/schemas/FixedAsset'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'

    post:
      summary: Create Fixed Asset
      description: Creates a new fixed asset.
      tags:
        - Fixed Assets
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FixedAssetInput'
      responses:
        '201':
          description: Fixed asset successfully created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FixedAsset'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'

  /finance/fixed-assets/{pk}/:
    get:
      summary: Get Fixed Asset
      description: Retrieves a specific fixed asset by ID.
      tags:
        - Fixed Assets
      parameters:
        - name: pk
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Fixed asset details.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FixedAsset'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          $ref: '#/components/responses/NotFoundError'

    patch:
      summary: Update Fixed Asset
      description: Partially updates a fixed asset.
      tags:
        - Fixed Assets
      parameters:
        - name: pk
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FixedAssetUpdateInput'
      responses:
        '200':
          description: Fixed asset successfully updated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FixedAsset'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          $ref: '#/components/responses/NotFoundError'

    delete:
      summary: Delete Fixed Asset
      description: Deletes a fixed asset. Fails if the asset has depreciation logs or is linked to an active BOM.
      tags:
        - Fixed Assets
      parameters:
        - name: pk
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Fixed asset successfully deleted.
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          $ref: '#/components/responses/NotFoundError'

  /finance/fixed-assets/depreciation/:
    post:
      summary: Run Fixed Asset Depreciation
      description: Runs depreciation for all active fixed assets for the specified period.
      tags:
        - Fixed Assets
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RunDepreciationInput'
      responses:
        '201':
          description: Depreciation successfully processed. Returns logs generated.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/FixedAssetDepreciationLog'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'

  /finance/fixed-assets/depreciation-logs/:
    get:
      summary: List Depreciation Logs
      description: Returns a paginated list of depreciation logs. Can be filtered by period or asset_id.
      tags:
        - Fixed Assets
      parameters:
        - name: period
          in: query
          required: false
          schema:
            type: string
            pattern: '^\d{4}-\d{2}$'
        - name: asset_id
          in: query
          required: false
          schema:
            type: string
            format: uuid
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            default: 50
        - name: page
          in: query
          required: false
          schema:
            type: integer
            default: 1
      responses:
        '200':
          description: A paginated list of depreciation logs.
          content:
            application/json:
              schema:
                type: object
                properties:
                  count:
                    type: integer
                  total_pages:
                    type: integer
                  current_page:
                    type: integer
                  results:
                    type: array
                    items:
                      $ref: '#/components/schemas/FixedAssetDepreciationLog'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'

  /finance/invoices/purchase/{pk}/pay/:
    post:
      summary: Pay Purchase Invoice (Finance)
      description: Tạo phiếu chi dòng tiền thanh toán cho hóa đơn mua hàng ngay từ phân hệ tài chính.
      tags:
        - Finance Payments
      parameters:
        - name: pk
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PayInvoiceInput'
      responses:
        '200':
          description: Thanh toán thành công, trả về hóa đơn đã cập nhật.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PurchaseInvoice'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          $ref: '#/components/responses/NotFoundError'
