openapi: 3.0.0
info:
  title: Finance API
  version: 1.0.0
  description: API documentation for the Finance module (Cash Flows).

servers:
  - url: /api/v1
    description: V1 API

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    CashFlowInput:
      type: object
      required:
        - payment_type
        - amount
        - payment_date
      properties:
        payment_type:
          type: string
          enum: [receive, pay]
        amount:
          type: string
          pattern: '^\d+(\.\d{1,2})?$'
        payment_date:
          type: string
          format: date
        category:
          type: string
          maxLength: 100
        payment_method:
          type: string
          enum: [cash, bank_transfer, credit_card, other]
          default: bank_transfer
        purchase_order_id:
          type: string
          format: uuid
          nullable: true
        sales_order_id:
          type: string
          format: uuid
          nullable: true
        purchase_invoice_id:
          type: string
          format: uuid
          nullable: true
        sales_invoice_id:
          type: string
          format: uuid
          nullable: true
        remarks:
          type: string

    CashFlowTransaction:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        payment_type:
          type: string
          enum: [receive, pay]
        category:
          type: string
        amount:
          type: string
        payment_date:
          type: string
          format: date
        remarks:
          type: string
        purchase_order:
          type: string
          format: uuid
          nullable: true
        sales_order:
          type: string
          format: uuid
          nullable: true
        purchase_invoice:
          type: string
          format: uuid
          nullable: true
        sales_invoice:
          type: string
          format: uuid
          nullable: true
        fixed_asset:
          type: string
          format: uuid
          nullable: true
        fixed_asset_code:
          type: string
          nullable: true
        status:
          type: string
          enum: [draft, pending_approval, posted, rejected]
        approved_by:
          type: string
          format: uuid
          nullable: true
        approved_by_username:
          type: string
          nullable: true
        approved_at:
          type: string
          format: date-time
          nullable: true
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    FixedAsset:
      type: object
      properties:
        id:
          type: string
          format: uuid
        asset_code:
          type: string
        asset_name:
          type: string
        original_value:
          type: string
        salvage_value:
          type: string
          description: "DEPRECATED - giá trị này không còn ý nghĩa nghiệp vụ"
        depreciation_method:
          type: string
          enum: [straight_line, unit_of_production]
        useful_life_months:
          type: integer
          nullable: true
        remaining_life_months:
          type: integer
          nullable: true
        designed_capacity:
          type: number
          format: double
          nullable: true
        accumulated_depreciation:
          type: string
        remaining_value:
          type: string
        department:
          type: string
          nullable: true
        status:
          type: string
          enum: [pending_receive, idle, active, pending_dispose, disposed]
        purchase_date:
          type: string
          format: date
          nullable: true
        disposal_date:
          type: string
          format: date
          nullable: true
        disposal_value:
          type: string
          nullable: true
        vendor_name:
          type: string
          nullable: true
        payment_method:
          type: string
          nullable: true
        is_active:
          type: boolean
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    FixedAssetPurchaseInput:
      type: object
      required:
        - asset_name
        - original_value
        - depreciation_method
        - vendor_name
      properties:
        asset_name:
          type: string
          maxLength: 255
        original_value:
          type: string
        depreciation_method:
          type: string
          enum: [straight_line, unit_of_production]
        useful_life_months:
          type: integer
          minimum: 1
          nullable: true
        designed_capacity:
          type: number
          format: double
          minimum: 0.01
          nullable: true
        vendor_name:
          type: string
          maxLength: 255
        payment_method:
          type: string
          enum: [cash, bank_transfer]
          default: bank_transfer

    FixedAssetRequestDisposeInput:
      type: object
      properties:
        disposal_value:
          type: string
          default: '0.00'
        remarks:
          type: string
          nullable: true

    FixedAssetUpdateInput:
      type: object
      properties:
        asset_name:
          type: string
          maxLength: 255
        useful_life_months:
          type: integer
          minimum: 1

    FixedAssetDepreciationLog:
      type: object
      properties:
        id:
          type: string
          format: uuid
        asset:
          type: string
          format: uuid
        asset_code:
          type: string
        asset_name:
          type: string
        period:
          type: string
        depreciation_amount:
          type: string
        remarks:
          type: string
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    RunDepreciationInput:
      type: object
      required:
        - period
      properties:
        period:
          type: string
          pattern: '^\d{4}-\d{2}$'

    PayInvoiceInput:
      type: object
      required:
        - amount
      properties:
        amount:
          type: number
          format: double
          minimum: 0.01
        payment_method:
          type: string
          enum: [cash, bank_transfer]
          default: bank_transfer

    CollectInvoiceInput:
      type: object
      required:
        - amount
      properties:
        amount:
          type: number
          format: double
          minimum: 0.01
        payment_method:
          type: string
          enum: [cash, bank_transfer]
          default: bank_transfer

    PurchaseInvoiceLine:
      type: object
      properties:
        id:
          type: string
          format: uuid
        item:
          type: string
          format: uuid
        item_name:
          type: string
        item_code:
          type: string
        quantity:
          type: number
          format: double
        unit_price:
          type: number
          format: double
        import_tax:
          type: number
          format: double
        vat_tax:
          type: number
          format: double
        line_total:
          type: number
          format: double

    PurchaseInvoice:
      type: object
      properties:
        id:
          type: string
          format: uuid
        order:
          type: string
          format: uuid
        stock_entry:
          type: string
          format: uuid
          nullable: true
        stock_entry_name:
          type: string
          nullable: true
        vendor:
          type: string
          format: uuid
        vendor_name:
          type: string
        status:
          type: string
          enum: [unpaid, partial, paid, blocked_for_payment, cancelled]
        total_amount:
          type: number
          format: double
        paid_amount:
          type: number
          format: double
        due_date:
          type: string
          format: date
          nullable: true
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        lines:
          type: array
          items:
            $ref: '#/components/schemas/PurchaseInvoiceLine'

    SalesInvoiceLine:
      type: object
      properties:
        id:
          type: string
          format: uuid
        item:
          type: string
          format: uuid
        item_name:
          type: string
        item_code:
          type: string
        quantity:
          type: number
          format: double
        unit_price:
          type: number
          format: double
        vat_tax:
          type: number
          format: double
        line_total:
          type: number
          format: double

    SalesInvoice:
      type: object
      properties:
        id:
          type: string
          format: uuid
        order:
          type: string
          format: uuid
        stock_entry:
          type: string
          format: uuid
          nullable: true
        stock_entry_name:
          type: string
          nullable: true
        customer:
          type: string
          format: uuid
        customer_name:
          type: string
        status:
          type: string
          enum: [unpaid, partial, paid, cancelled]
        total_amount:
          type: number
          format: double
        paid_amount:
          type: number
          format: double
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        lines:
          type: array
          items:
            $ref: '#/components/schemas/SalesInvoiceLine'

    SalarySlip:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        employee_id:
          type: string
          format: uuid
        employee_code:
          type: string
        employee_name:
          type: string
        salary_period:
          type: string
          description: Định dạng YYYY-MM
        base_salary:
          type: string
        overtime_amount:
          type: string
        allowance_amount:
          type: string
        reward_amount_total:
          type: string
        discipline_deduction_total:
          type: string
        gross_pay:
          type: string
        deductions:
          type: string
        net_pay:
          type: string
        payment_method:
          type: string
          enum: [cash, bank_transfer]
          nullable: true
        status:
          type: string
          enum: [draft, calculated, pending_finance_review, approved, paid]
        remarks:
          type: string
          nullable: true
        breakdown:
          type: object
          nullable: true
          properties:
            standard_working_days:
              type: integer
            incomes:
              type: array
              items:
                type: object
                properties:
                  name:
                    type: string
                  amount:
                    type: number
            deductions:
              type: array
              items:
                type: object
                properties:
                  name:
                    type: string
                  amount:
                    type: number
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    SalarySlipPaymentInput:
      type: object
      properties:
        payment_method:
          type: string
          enum: [cash, bank_transfer]
          default: bank_transfer

    SalarySlipRejectInput:
      type: object
      required:
        - reason
      properties:
        reason:
          type: string
          minLength: 10

    SalarySlipBulkApprovePayInput:
      type: object
      required:
        - salary_period
      properties:
        salary_period:
          type: string
          pattern: '^\d{4}-\d{2}$'
        payment_method:
          type: string
          enum: [cash, bank_transfer]
          default: bank_transfer

    SalarySlipBulkApproveInput:
      type: object
      required:
        - salary_period
      properties:
        salary_period:
          type: string
          pattern: '^\d{4}-\d{2}$'

    SalarySlipBulkPayInput:
      type: object
      required:
        - salary_period
      properties:
        salary_period:
          type: string
          pattern: '^\d{4}-\d{2}$'
        payment_method:
          type: string
          enum: [cash, bank_transfer]
          default: bank_transfer



  responses:
    UnauthorizedError:
      description: Missing or invalid authentication token.
    ForbiddenError:
      description: The user does not have permission to perform this action.
    ValidationError:
      description: Invalid input data (e.g. overpayment, negative numbers).
      content:
        application/json:
          schema:
            type: object
            properties:
              detail:
                type: string
    NotFoundError:
      description: Requested reference order or invoice could not be found.
      content:
        application/json:
          schema:
            type: object
            properties:
              detail:
                type: string

security:
  - bearerAuth: []

paths:
  /finance/cash-flows/:
    get:
      summary: List Cash Flows
      description: Returns a paginated list of cash flow transactions.
      tags:
        - Cash Flows
      parameters:
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            default: 20
        - name: page
          in: query
          required: false
          schema:
            type: integer
            default: 1
        - name: status
          in: query
          required: false
          schema:
            type: string
      responses:
        '200':
          description: A paginated list of cash flows.
          content:
            application/json:
              schema:
                type: object
                properties:
                  count:
                    type: integer
                  total_pages:
                    type: integer
                  current_page:
                    type: integer
                  results:
                    type: array
                    items:
                      $ref: '#/components/schemas/CashFlowTransaction'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'

    post:
      summary: Create Cash Flow Transaction
      description: Creates a new cash flow transaction. Can optionally link to orders or invoices to process deposits or payments. Validates overpayment logic.
      tags:
        - Cash Flows
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CashFlowInput'
      responses:
        '201':
          description: Cash flow successfully created and cross-updated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CashFlowTransaction'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          $ref: '#/components/responses/NotFoundError'

  /finance/cash-flows/{pk}/:
    get:
      summary: Get Cash Flow Transaction
      description: Retrieves a specific cash flow transaction by ID.
      tags:
        - Cash Flows
      parameters:
        - name: pk
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Cash flow details.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CashFlowTransaction'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          $ref: '#/components/responses/NotFoundError'

  /finance/cash-flows/{pk}/approve/:
    post:
      summary: Approve Cash Flow Transaction
      description: Approves a cash flow transaction, which triggers the actual debt/advance updates on linked orders or invoices.
      tags:
        - Cash Flows
      parameters:
        - name: pk
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Cash flow transaction successfully approved.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CashFlowTransaction'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          $ref: '#/components/responses/NotFoundError'

  /finance/cash-flows/{pk}/reject/:
    post:
      summary: Reject Cash Flow Transaction
      description: Rejects a cash flow transaction, which reverts linked fixed assets back to idle (or deletes them if it was a pending purchase).
      tags:
        - Cash Flows
      parameters:
        - name: pk
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                remarks:
                  type: string
                  description: Optional reason for rejecting the transaction.
      responses:
        '200':
          description: Cash flow transaction successfully rejected.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CashFlowTransaction'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          $ref: '#/components/responses/NotFoundError'

  /finance/fixed-assets/:
    get:
      summary: List Fixed Assets
      description: Returns a paginated list of fixed assets.
      tags:
        - Fixed Assets
      parameters:
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            default: 50
        - name: page
          in: query
          required: false
          schema:
            type: integer
            default: 1
        - name: status__in
          in: query
          required: false
          description: Comma-separated list of statuses to filter by.
          schema:
            type: string
        - name: assignable
          in: query
          required: false
          description: If true, only returns idle assets.
          schema:
            type: boolean
        - name: depreciation_method
          in: query
          required: false
          description: Depreciation method to filter by.
          schema:
            type: string
            enum: [straight_line, unit_of_production]
      responses:
        '200':
          description: A paginated list of fixed assets.
          content:
            application/json:
              schema:
                type: object
                properties:
                  count:
                    type: integer
                  total_pages:
                    type: integer
                  current_page:
                    type: integer
                  results:
                    type: array
                    items:
                      $ref: '#/components/schemas/FixedAsset'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'

    post:
      summary: Create Fixed Asset
      description: Creates a new fixed asset.
      tags:
        - Fixed Assets
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FixedAssetPurchaseInput'
      responses:
        '201':
          description: Fixed asset successfully created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FixedAsset'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'

  /finance/fixed-assets/{pk}/:
    get:
      summary: Get Fixed Asset
      description: Retrieves a specific fixed asset by ID.
      tags:
        - Fixed Assets
      parameters:
        - name: pk
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Fixed asset details.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FixedAsset'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          $ref: '#/components/responses/NotFoundError'

    patch:
      summary: Update Fixed Asset
      description: Partially updates a fixed asset.
      tags:
        - Fixed Assets
      parameters:
        - name: pk
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FixedAssetUpdateInput'
      responses:
        '200':
          description: Fixed asset successfully updated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FixedAsset'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          $ref: '#/components/responses/NotFoundError'

    delete:
      summary: Delete Fixed Asset
      description: Deletes a fixed asset. Fails if the asset has depreciation logs or is linked to an active BOM.
      tags:
        - Fixed Assets
      parameters:
        - name: pk
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Fixed asset successfully deleted.
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          $ref: '#/components/responses/NotFoundError'



  /finance/fixed-assets/{pk}/request-dispose/:
    post:
      summary: Request Dispose Fixed Asset
      description: Requests disposal of fixed asset, changing status to pending_dispose and setting disposal date/value.
      tags:
        - Fixed Assets
      parameters:
        - name: pk
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FixedAssetRequestDisposeInput'
      responses:
        '200':
          description: Fixed asset disposal request successfully registered.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FixedAsset'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          $ref: '#/components/responses/NotFoundError'


  /finance/fixed-assets/depreciation/:
    post:
      summary: Run Fixed Asset Depreciation
      description: Runs depreciation for all active fixed assets for the specified period.
      tags:
        - Fixed Assets
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RunDepreciationInput'
      responses:
        '201':
          description: Depreciation successfully processed. Returns logs generated.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/FixedAssetDepreciationLog'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'

  /finance/fixed-assets/depreciation-logs/:
    get:
      summary: List Depreciation Logs
      description: Returns a paginated list of depreciation logs. Can be filtered by period or asset_id.
      tags:
        - Fixed Assets
      parameters:
        - name: period
          in: query
          required: false
          schema:
            type: string
            pattern: '^\d{4}-\d{2}$'
        - name: asset_id
          in: query
          required: false
          schema:
            type: string
            format: uuid
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            default: 50
        - name: page
          in: query
          required: false
          schema:
            type: integer
            default: 1
      responses:
        '200':
          description: A paginated list of depreciation logs.
          content:
            application/json:
              schema:
                type: object
                properties:
                  count:
                    type: integer
                  total_pages:
                    type: integer
                  current_page:
                    type: integer
                  results:
                    type: array
                    items:
                      $ref: '#/components/schemas/FixedAssetDepreciationLog'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'

  /finance/invoices/purchase/:
    get:
      summary: List Purchase Invoices (Paginated)
      description: Trả về danh sách hóa đơn mua hàng dạng phân trang từ phân hệ tài chính.
      tags:
        - Purchase Invoices
      parameters:
        - name: status
          in: query
          required: false
          schema:
            type: string
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            default: 10
        - name: page
          in: query
          required: false
          schema:
            type: integer
            default: 1
      responses:
        '200':
          description: A paginated list of purchase invoices.
          content:
            application/json:
              schema:
                type: object
                properties:
                  count:
                    type: integer
                  total_pages:
                    type: integer
                  current_page:
                    type: integer
                  results:
                    type: array
                    items:
                      $ref: '#/components/schemas/PurchaseInvoice'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
