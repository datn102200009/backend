openapi: 3.0.0
info:
  title: Purchasing API
  version: 1.0.0
  description: API documentation for the Purchasing module (Purchase Orders and Purchase Invoices).

servers:
  - url: /api/v1
    description: V1 API

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    PurchaseOrderLineInput:
      type: object
      required:
        - item_id
        - quantity
        - unit_price
      properties:
        item_id:
          type: string
          format: uuid
        quantity:
          type: number
          format: double
          minimum: 0.01
        unit_price:
          type: number
          format: double
          minimum: 0

    PurchaseOrderInput:
      type: object
      required:
        - vendor_id
        - lines
      properties:
        vendor_id:
          type: string
          format: uuid
        advance_paid_amount:
          type: number
          format: double
          minimum: 0
        expected_delivery_date:
          type: string
          format: date
          nullable: true
        lines:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/PurchaseOrderLineInput'

    PurchaseOrderReceiveInput:
      type: object
      required:
        - target_warehouse_id
      properties:
        target_warehouse_id:
          type: string
          format: uuid

    PurchaseOrderLine:
      type: object
      properties:
        id:
          type: string
          format: uuid
        item:
          type: string
          format: uuid
        item_name:
          type: string
        item_code:
          type: string
        quantity:
          type: number
          format: double
        unit_price:
          type: number
          format: double
        line_total:
          type: number
          format: double
        receipt_fulfillment_rate:
          type: number
          format: double

    PurchaseOrder:
      type: object
      properties:
        id:
          type: string
          format: uuid
        vendor:
          type: string
          format: uuid
        vendor_name:
          type: string
        status:
          type: string
          enum: [draft, pending, paid_unshipped, shipped_unpaid, completed, cancelled]
        total_amount:
          type: number
          format: double
        advance_paid_amount:
          type: number
          format: double
        expected_delivery_date:
          type: string
          format: date
          nullable: true
        receipt_fulfillment_rate:
          type: number
          format: double
        payment_fulfillment_rate:
          type: number
          format: double
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        lines:
          type: array
          items:
            $ref: '#/components/schemas/PurchaseOrderLine'
        invoices:
          type: array
          items:
            type: object
            properties:
              id:
                type: string
                format: uuid
              status:
                type: string
                enum: [unpaid, partial, paid, cancelled]
              total_amount:
                type: number
              paid_amount:
                type: number
        stock_entries:
          type: array
          items:
            type: object
            properties:
              id:
                type: string
                format: uuid
              name:
                type: string
              status:
                type: string
                enum: [draft, submitted, posted]
              purpose:
                type: string
                enum: [receipt, issue, transfer, manufacture, adjustment]

    PurchaseInvoiceLine:
      type: object
      properties:
        id:
          type: string
          format: uuid
        item:
          type: string
          format: uuid
        item_name:
          type: string
        item_code:
          type: string
        quantity:
          type: number
          format: double
        unit_price:
          type: number
          format: double
        import_tax:
          type: number
          format: double
        vat_tax:
          type: number
          format: double
        line_total:
          type: number
          format: double

    PurchaseInvoice:
      type: object
      properties:
        id:
          type: string
          format: uuid
        order:
          type: string
          format: uuid
        stock_entry:
          type: string
          format: uuid
          nullable: true
        stock_entry_name:
          type: string
          nullable: true
        vendor:
          type: string
          format: uuid
        vendor_name:
          type: string
        status:
          type: string
          enum: [unpaid, partial, paid, cancelled]
        total_amount:
          type: number
          format: double
        paid_amount:
          type: number
          format: double
        due_date:
          type: string
          format: date
          nullable: true
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        lines:
          type: array
          items:
            $ref: '#/components/schemas/PurchaseInvoiceLine'



    LandedCostAllocationInput:
      type: object
      required:
        - shipment_id
        - total_logistic_fees
      properties:
        shipment_id:
          type: string
          format: uuid
        total_logistic_fees:
          type: number
          format: double
          minimum: 0.01

    Shipment:
      type: object
      properties:
        id:
          type: string
          format: uuid
        shipment_num:
          type: string
        name:
          type: string
        purchase_order:
          type: string
          format: uuid
          nullable: true
        purchase_order_lines:
          type: array
          items:
            type: object
            properties:
              id:
                type: string
                format: uuid
              item_id:
                type: string
                format: uuid
              item_code:
                type: string
              item_name:
                type: string
              quantity:
                type: number
              unit:
                type: string
        total_logistic_fees:
          type: number
          format: double
        status:
          type: string
          enum: [draft, inspecting, completed]
        remarks:
          type: string
          nullable: true
        stock_entries:
          type: array
          items:
            type: object
            properties:
              id:
                type: string
                format: uuid
              name:
                type: string
              status:
                type: string
              purpose:
                type: string
        stock_entries_details:
          type: array
          items:
            type: object
            properties:
              id:
                type: string
                format: uuid
              item_id:
                type: string
                format: uuid
              item_code:
                type: string
              item_name:
                type: string
              uom_name:
                type: string
              quantity:
                type: number
              source_warehouse_id:
                type: string
                format: uuid
                nullable: true
              source_warehouse_name:
                type: string
                nullable: true
              target_warehouse_id:
                type: string
                format: uuid
                nullable: true
              target_warehouse_name:
                type: string
                nullable: true
              stock_entry_id:
                type: string
                format: uuid
              stock_entry_name:
                type: string
              stock_entry_status:
                type: string
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    ShipmentInput:
      type: object
      required:
        - shipment_num
        - name
      properties:
        shipment_num:
          type: string
        name:
          type: string
        remarks:
          type: string
          nullable: true
        purchase_order_id:
          type: string
          format: uuid
          nullable: true
        stock_entry_ids:
          type: array
          items:
            type: string
            format: uuid

    ShipmentDetailComplete:
      type: object
      required:
        - po_line_id
        - item_id
        - quantity
      properties:
        po_line_id:
          type: string
          format: uuid
        item_id:
          type: string
          format: uuid
        quantity:
          type: number
        target_warehouse_id:
          type: string
          format: uuid
          nullable: true

    ShipmentCompleteInput:
      type: object
      required:
        - total_logistic_fees
        - details
      properties:
        total_logistic_fees:
          type: number
          minimum: 0
        details:
          type: array
          items:
            $ref: '#/components/schemas/ShipmentDetailComplete'

    APAging:
      type: object
      properties:
        vendor_id:
          type: string
          format: uuid
        vendor_code:
          type: string
        vendor_name:
          type: string
        total_unpaid:
          type: number
          format: double
        not_due:
          type: number
          format: double
        overdue_1_30:
          type: number
          format: double
        overdue_above_30:
          type: number
          format: double



    PurchaseOrderCancelInput:
      type: object
      properties:
        refund_deposit:
          type: boolean
          default: true
          description: "Có nhận lại tiền cọc hay không (khi chưa có hàng nhập kho)"
        keep_goods:
          type: boolean
          default: false
          description: "Có giữ lại phần hàng đã nhận hay không (khi đã có hàng nhập kho)"

  responses:
    UnauthorizedError:
      description: Missing or invalid authentication token.
    ForbiddenError:
      description: The user does not have permission to perform this action.
    ValidationError:
      description: Invalid input data (e.g. negative numbers, missing required fields).
      content:
        application/json:
          schema:
            type: object
            properties:
              detail:
                type: string
    NotFoundError:
      description: Requested resource could not be found.
      content:
        application/json:
          schema:
            type: object
            properties:
              detail:
                type: string

security:
  - bearerAuth: []

paths:


  /purchasing/orders/:
    get:
      summary: List Purchase Orders
      description: Returns a list of purchase orders.
      tags:
        - Purchasing Orders
      responses:
        '200':
          description: A list of purchase orders.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/PurchaseOrder'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'

    post:
      summary: Create Purchase Order
      description: Creates a new purchase order.
      tags:
        - Purchasing Orders
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PurchaseOrderInput'
      responses:
        '201':
          description: Purchase order successfully created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PurchaseOrder'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'

  /purchasing/orders/{pk}/:
    get:
      summary: Get Purchase Order
      description: Retrieves a specific purchase order by ID.
      tags:
        - Purchasing Orders
      parameters:
        - name: pk
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Purchase order details.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PurchaseOrder'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          $ref: '#/components/responses/NotFoundError'

    put:
      summary: Update Purchase Order
      description: Updates an existing purchase order (only allowed in DRAFT status).
      tags:
        - Purchasing Orders
      parameters:
        - name: pk
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PurchaseOrderInput'
      responses:
        '200':
          description: Purchase order successfully updated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PurchaseOrder'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          $ref: '#/components/responses/NotFoundError'

    delete:
      summary: Delete Purchase Order
      description: Deletes a purchase order (only allowed in DRAFT status).
      tags:
        - Purchasing Orders
      parameters:
        - name: pk
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: Purchase order successfully deleted.
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          $ref: '#/components/responses/NotFoundError'

  /purchasing/orders/{pk}/receive/:
    post:
      deprecated: true
      summary: Receive Goods from Purchase Order (DEPRECATED)
      description: Quy trình nhận hàng trực tiếp qua đơn mua đã bị loại bỏ. Vui lòng duyệt Phiếu nhập kho tương ứng.
      tags:
        - Purchasing Orders
      parameters:
        - name: pk
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          $ref: '#/components/responses/NotFoundError'

  /purchasing/orders/{pk}/approve/:
    post:
      summary: Approve Purchase Order
      description: Phê duyệt Đơn mua hàng (chuyển sang PENDING), sinh tự động Hóa đơn mua hàng (Draft/Unpaid) và Phiếu nhập kho nháp (Draft).
      tags:
        - Purchasing Orders
      parameters:
        - name: pk
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Đơn mua hàng đã được duyệt thành công.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PurchaseOrder'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          $ref: '#/components/responses/NotFoundError'

  /purchasing/orders/{pk}/cancel/:
    post:
      summary: Cancel Purchase Order
      description: Hủy Đơn mua hàng (chuyển sang CANCELLED), đảo ngược/hủy phiếu kho và giao dịch dòng tiền liên quan.
      tags:
        - Purchasing Orders
      parameters:
        - name: pk
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PurchaseOrderCancelInput'
      responses:
        '200':
          description: Đơn mua hàng đã được hủy thành công.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PurchaseOrder'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          $ref: '#/components/responses/NotFoundError'

  /purchasing/invoices/:
    get:
      summary: List Purchase Invoices
      description: Returns a list of purchase invoices.
      tags:
        - Purchasing Invoices
      parameters:
        - name: status
          in: query
          required: false
          schema:
            type: string
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            default: 10
        - name: page
          in: query
          required: false
          schema:
            type: integer
            default: 1
      responses:
        '200':
          description: A paginated list of purchase invoices.
          content:
            application/json:
              schema:
                type: object
                properties:
                  count:
                    type: integer
                  total_pages:
                    type: integer
                  current_page:
                    type: integer
                  results:
                    type: array
                    items:
                      $ref: '#/components/schemas/PurchaseInvoice'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'

  /purchasing/invoices/{pk}/:
    get:
      summary: Get Purchase Invoice
      description: Retrieves a specific purchase invoice by ID.
      tags:
        - Purchasing Invoices
      parameters:
        - name: pk
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Purchase invoice details.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PurchaseInvoice'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          $ref: '#/components/responses/NotFoundError'





  /purchasing/shipments/:
    get:
      summary: List Shipments
      description: Trả về danh sách các lô hàng.
      tags:
        - Shipments
      responses:
        '200':
          description: Danh sách lô hàng.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Shipment'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'

    post:
      summary: Create Shipment
      description: Tạo hồ sơ lô hàng mới và liên kết các phiếu nhập kho.
      tags:
        - Shipments
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ShipmentInput'
      responses:
        '201':
          description: Tạo thành công.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Shipment'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'

  /purchasing/shipments/{pk}/:
    get:
      summary: Get Shipment Detail
      description: Trả về chi tiết của một lô hàng.
      tags:
        - Shipments
      parameters:
        - name: pk
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Chi tiết lô hàng.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Shipment'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          $ref: '#/components/responses/NotFoundError'

    put:
      summary: Update Shipment Status and Remarks
      description: Cập nhật trạng thái và ghi chú của lô hàng (hỗ trợ chuyển draft -> inspecting).
      tags:
        - Shipments
      parameters:
        - name: pk
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                status:
                  type: string
                  enum: [draft, inspecting, completed]
                remarks:
                  type: string
                  nullable: true
      responses:
        '200':
          description: Cập nhật thành công.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Shipment'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          $ref: '#/components/responses/NotFoundError'

  /purchasing/shipments/{pk}/complete/:
    post:
      summary: Complete Shipment (Tiếp nhận & Hoàn tất lô hàng)
      description: Nhập số lượng đạt chuẩn cho từng dòng PO và chi phí logistic để tạo StockEntry posted trực tiếp và hoàn tất lô hàng.
      tags:
        - Shipments
      parameters:
        - name: pk
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ShipmentCompleteInput'
      responses:
        '200':
          description: Hoàn tất thành công.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Shipment'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          $ref: '#/components/responses/NotFoundError'

  /purchasing/shipments/allocate/:
    post:
      summary: Allocate Landed Cost (Logistic Fees)
      description: Ghi nhận tổng chi phí logistic và hoàn tất hồ sơ lô hàng.
      tags:
        - Shipments
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LandedCostAllocationInput'
      responses:
        '200':
          description: Phân bổ thành công.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Shipment'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          $ref: '#/components/responses/NotFoundError'

  /purchasing/reports/ap-aging/:
    get:
      summary: AP Aging Report
      description: Xuất báo cáo tuổi nợ NCC gom nhóm ở database.
      tags:
        - Purchasing Reports
      parameters:
        - name: supplier_id
          in: query
          required: false
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Bảng báo cáo tuổi nợ.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/APAging'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
