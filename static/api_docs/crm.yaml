openapi: 3.0.0
info:
  title: DATN ERP System API - CRM
  version: 1.0.0
  description: >
    API Documentation for the DATN ERP System Backend - CRM Module.
    Includes Customer management with Rate Limiting and Role-Based Access Control.
servers:
  - url: /api/v1
    description: Local development server
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  responses:
    UnauthorizedError:
      description: Unauthorized. Missing or invalid authentication token.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            detail: "Authentication credentials were not provided."
    ForbiddenError:
      description: Forbidden. User lacks necessary permissions.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            detail: "You do not have permission to perform this action."
    NotFoundError:
      description: Not Found. Resource does not exist.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            detail: "Not found."
  schemas:
    ErrorResponse:
      type: object
      properties:
        detail:
          type: string
    Customer:
      type: object
      required:
        - id
        - name
        - customer_name
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
          example: "CUS-001"
          description: "Mã định danh duy nhất của khách hàng"
        customer_name:
          type: string
          example: "Công ty TNHH Giải pháp Công nghệ Việt"
          description: "Tên đầy đủ của khách hàng"
        customer_group:
          type: string
          nullable: true
          example: "Commercial"
          description: "Nhóm khách hàng (ví dụ: Commercial, Individual, Government)"
        contact_email:
          type: string
          format: email
          nullable: true
          example: "contact@viettech.com"
        contact_phone:
          type: string
          nullable: true
          example: "0912345678"
        address:
          type: string
          nullable: true
          example: "Số 1 Đại Cồ Việt, Bách Khoa, Hai Bà Trưng, Hà Nội"
        is_active:
          type: boolean
          example: true
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    CustomerInput:
      type: object
      required:
        - name
        - customer_name
      properties:
        name:
          type: string
          example: "CUS-001"
          description: "Mã định danh duy nhất của khách hàng"
        customer_name:
          type: string
          example: "Công ty TNHH Giải pháp Công nghệ Việt"
          description: "Tên đầy đủ của khách hàng"
        customer_group:
          type: string
          nullable: true
          example: "Commercial"
          description: "Nhóm khách hàng"
        contact_email:
          type: string
          format: email
          nullable: true
          example: "contact@viettech.com"
        contact_phone:
          type: string
          nullable: true
          example: "0912345678"
        address:
          type: string
          nullable: true
          example: "Số 1 Đại Cồ Việt, Bách Khoa, Hai Bà Trưng, Hà Nội"
security:
  - bearerAuth: []
paths:
  /crm/customers/:
    get:
      summary: Lấy danh sách Khách hàng
      description: |
        Lấy danh sách tất cả các Khách hàng trong hệ thống.
        Yêu cầu quyền truy cập: `crm.view`.
      responses:
        '200':
          description: Thành công
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Customer'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'

    post:
      summary: Tạo Khách hàng mới
      description: |
        Tạo thông tin khách hàng mới trong hệ thống.
        Yêu cầu quyền truy cập: `crm.add`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CustomerInput'
      responses:
        '201':
          description: Tạo thành công
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Customer'
        '400':
          description: Dữ liệu đầu vào không hợp lệ hoặc trùng mã khách hàng
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'

  /crm/customers/{customer_id}/:
    get:
      summary: Xem chi tiết Khách hàng
      description: |
        Lấy thông tin chi tiết của một Khách hàng thông qua UUID.
        Yêu cầu quyền truy cập: `crm.view`.
      parameters:
        - in: path
          name: customer_id
          required: true
          schema:
            type: string
            format: uuid
          description: UUID của khách hàng cần xem
      responses:
        '200':
          description: Thành công
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Customer'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          $ref: '#/components/responses/NotFoundError'

    put:
      summary: Cập nhật thông tin Khách hàng
      description: |
        Cập nhật toàn bộ thông tin của một Khách hàng thông qua UUID.
        Yêu cầu quyền truy cập: `crm.change`.
      parameters:
        - in: path
          name: customer_id
          required: true
          schema:
            type: string
            format: uuid
          description: UUID của khách hàng cần cập nhật
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CustomerInput'
      responses:
        '200':
          description: Cập nhật thành công
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Customer'
        '400':
          description: Dữ liệu đầu vào không hợp lệ
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          $ref: '#/components/responses/NotFoundError'

    delete:
      summary: Xóa Khách hàng
      description: |
        Xóa một Khách hàng thông qua UUID.
        Yêu cầu quyền truy cập: `crm.delete`.
      parameters:
        - in: path
          name: customer_id
          required: true
          schema:
            type: string
            format: uuid
          description: UUID của khách hàng cần xóa
      responses:
        '204':
          description: Xóa thành công (Không có nội dung trả về)
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          $ref: '#/components/responses/NotFoundError'
